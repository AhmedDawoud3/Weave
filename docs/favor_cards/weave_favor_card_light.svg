<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1485" width="1050" height="1485">
  <defs>
    <!-- Light Background Gradient -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Electric Blue Accent Gradient -->
    <linearGradient id="electric-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1050" height="1485" fill="url(#bg-grad-light)"/>

  <!-- Outer Card Border Frame -->
  <rect x="25" y="25" width="1000" height="1435" rx="30" fill="none" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Neural Network Vector Background Overlay (Subtle Blue Lines) -->
  <g stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.2">
    <line x1="80" y1="120" x2="250" y2="220" />
    <line x1="250" y1="220" x2="450" y2="150" />
    <line x1="450" y1="150" x2="700" y2="260" />
    <line x1="700" y1="260" x2="950" y2="140" />

    <line x1="120" y1="1350" x2="300" y2="1250" />
    <line x1="300" y1="1250" x2="550" y2="1360" />
    <line x1="550" y1="1360" x2="800" y2="1280" />
    <line x1="800" y1="1280" x2="920" y2="1380" />
  </g>

  <!-- Background Network Nodes -->
  <g fill="#0284C7" opacity="0.4">
    <circle cx="80" cy="120" r="6" />
    <circle cx="250" cy="220" r="8" />
    <circle cx="450" cy="150" r="7" />
    <circle cx="700" cy="260" r="9" />
    <circle cx="950" cy="140" r="6" />

    <circle cx="120" cy="1350" r="6" />
    <circle cx="300" cy="1250" r="8" />
    <circle cx="550" cy="1360" r="7" />
    <circle cx="800" cy="1280" r="9" />
    <circle cx="920" cy="1380" r="6" />
  </g>

  <!-- HEADER SECTION -->
  <!-- WEAVE Logo Node W -->
  <g transform="translate(140, 100)">
    <!-- W Node Lines -->
    <path d="M 10 20 L 45 100 L 80 35 L 115 100 L 150 20" fill="none" stroke="url(#electric-blue)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- W Nodes -->
    <circle cx="10" cy="20" r="9" fill="#0284C7"/>
    <circle cx="45" cy="100" r="9" fill="#0284C7"/>
    <circle cx="80" cy="35" r="9" fill="#0284C7"/>
    <circle cx="115" cy="100" r="9" fill="#0284C7"/>
    <circle cx="150" cy="20" r="9" fill="#0284C7"/>
  </g>

  <!-- Logo Text -->
  <text x="320" y="185" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" letter-spacing="12" fill="#0F172A">WEAVE</text>

  <!-- Main Headline -->
  <text x="525" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="44" fill="#0284C7" text-anchor="middle" letter-spacing="1">Neural Networks Just Got Sweeter 🍫</text>

  <!-- Subtitle / Tagline -->
  <text x="525" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#475569" text-anchor="middle" letter-spacing="2">DRAG. CONNECT. COMPILE.</text>

  <!-- CENTER CHOCOLATE MOUNTING FRAME -->
  <g transform="translate(265, 390)">
    <!-- Card Frame Outer Box -->
    <rect width="520" height="520" rx="28" fill="#F1F5F9" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="10 8"/>

    <!-- Inner Mounting Target Area -->
    <rect x="35" y="35" width="450" height="450" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Chocolate Placeholder Icon & Text -->
    <g transform="translate(260, 230)" text-anchor="middle">
      <!-- Gift / Chocolate Box Silhouette -->
      <path d="M -40 -30 L 40 -30 L 40 40 L -40 40 Z" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4 4"/>
      <path d="M 0 -30 L 0 40" stroke="#94A3B8" stroke-width="3"/>
      <path d="M -40 5 L 40 5" stroke="#94A3B8" stroke-width="3"/>

      <!-- Text Instructions -->
      <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="26" fill="#0284C7" letter-spacing="1">ATTACH YOUR CHOCOLATE HERE</text>
      <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#64748B">A Sweet Thank You For Attending!</text>
    </g>
  </g>

  <!-- LOWER FEATURE BADGES -->
  <g transform="translate(115, 965)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="250" height="55" rx="27.5" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="125" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#0369A1" text-anchor="middle">Visual Canvas</text>

    <!-- Badge 2 -->
    <rect x="285" y="0" width="250" height="55" rx="27.5" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="410" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#4338CA" text-anchor="middle">PyTorch Compiler</text>

    <!-- Badge 3 -->
    <rect x="570" y="0" width="250" height="55" rx="27.5" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1.5"/>
    <text x="695" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#6B21A8" text-anchor="middle">FastAPI Engine</text>
  </g>

  <!-- QR CODE & DEMO LINK SECTION -->
  <g transform="translate(115, 1055)">
    <!-- QR Box -->
    <rect x="0" y="0" width="160" height="160" rx="16" fill="#0F172A"/>
    <!-- Stylized QR Code Graphic -->
    <g fill="#FFFFFF" transform="translate(15, 15)">
      <!-- Outer QR corners -->
      <rect x="0" y="0" width="40" height="40" rx="6"/>
      <rect x="6" y="6" width="28" height="28" fill="#0F172A"/>
      <rect x="12" y="12" width="16" height="16"/>

      <rect x="90" y="0" width="40" height="40" rx="6"/>
      <rect x="96" y="6" width="28" height="28" fill="#0F172A"/>
      <rect x="102" y="12" width="16" height="16"/>

      <rect x="0" y="90" width="40" height="40" rx="6"/>
      <rect x="6" y="96" width="28" height="28" fill="#0F172A"/>
      <rect x="12" y="102" width="16" height="16"/>

      <!-- QR Pattern Blocks -->
      <rect x="50" y="10" width="12" height="12"/>
      <rect x="70" y="20" width="12" height="25"/>
      <rect x="10" y="50" width="25" height="12"/>
      <rect x="50" y="50" width="30" height="30" fill="#38BDF8"/>
      <rect x="90" y="55" width="25" height="12"/>
      <rect x="60" y="90" width="20" height="20"/>
      <rect x="95" y="95" width="25" height="25"/>
    </g>

    <!-- Scan Text Info -->
    <g transform="translate(195, 40)">
      <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="30" fill="#0F172A">SCAN TO LAUNCH LIVE DEMO</text>
      <text x="0" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#475569">Experience Weave's Neural Graph Canvas Live</text>
      <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#0284C7">weave-ai.demo</text>
    </g>
  </g>

  <!-- FOOTER TEAM CREDITS SECTION -->
  <line x1="80" y1="1260" x2="970" y2="1260" stroke="#CBD5E1" stroke-width="2"/>

  <g transform="translate(115, 1310)">
    <!-- Team Members -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#0F172A">Graduation Project Team:</text>
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#475569">Ahmed Dawoud &amp; Team Members</text>

    <!-- Supervisor -->
    <text x="820" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#0F172A" text-anchor="end">Supervisor:</text>
    <text x="820" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#475569" text-anchor="end">Dr. Project Advisor</text>

    <!-- Department Footer -->
    <text x="410" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#64748B" text-anchor="middle" letter-spacing="1">DEPARTMENT OF COMPUTER SCIENCE &amp; ARTIFICIAL INTELLIGENCE — 2026</text>
  </g>
</svg>

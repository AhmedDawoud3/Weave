<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEAVE Favor Cards - 4-Up A4 Print Sheet</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1E293B;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Controls Bar (Hidden during printing) */
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      background: #0F172A;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1fr solid #334155;
    }

    .btn {
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: #0369A1;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #334155;
      color: #F8FAFC;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    /* A4 Print Sheet Container */
    .a4-page {
      width: 210mm;
      height: 297mm;
      background: #0B0F19;
      display: grid;
      grid-template-columns: 105mm 105mm;
      grid-template-rows: 148.5mm 148.5mm;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* Individual A6 Card Quadrant */
    .card-cell {
      width: 105mm;
      height: 148.5mm;
      position: relative;
      border: 1px dashed rgba(148, 163, 184, 0.3); /* Cut Lines */
      overflow: hidden;
    }

    .card-cell svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Light Theme Class Override */
    .light-theme .a4-page {
      background: #FFFFFF;
    }

    .light-theme .card-cell {
      border-color: rgba(203, 213, 225, 0.8);
    }

    /* PRINT SPECIFIC STYLES */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0mm;
      }

      body {
        background: none;
        padding: 0;
        margin: 0;
      }

      .no-print {
        display: none !important;
      }

      .a4-page {
        box-shadow: none;
        width: 210mm;
        height: 297mm;
        page-break-after: always;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .card-cell {
        border-color: #CBD5E1 !important; /* Visible cut marks when printing */
      }
    }
  </style>
</head>
<body id="body-container">

  <!-- Top Controls Header -->
  <div class="controls no-print">
    <button class="btn" onclick="window.print()">
      🖨️ Print 4-Up A4 Sheet (Ctrl + P)
    </button>
    <button class="btn btn-secondary" onclick="toggleTheme()">
      🎨 Toggle Theme (Dark / Ink-Saver)
    </button>
    <a href="../favor_cards/weave_favor_card.svg" download class="btn btn-secondary" style="text-decoration: none;">
      📥 Download Dark Canva SVG
    </a>
    <a href="../favor_cards/weave_favor_card_light.svg" download class="btn btn-secondary" style="text-decoration: none;">
      📥 Download Light Canva SVG
    </a>
  </div>

  <!-- A4 PRINT CONTAINER (4-UP GRID) -->
  <div class="a4-page" id="print-sheet">
    
    <!-- Quadrant 1 (Top Left) -->
    <div class="card-cell" id="card-1"></div>

    <!-- Quadrant 2 (Top Right) -->
    <div class="card-cell" id="card-2"></div>

    <!-- Quadrant 3 (Bottom Left) -->
    <div class="card-cell" id="card-3"></div>

    <!-- Quadrant 4 (Bottom Right) -->
    <div class="card-cell" id="card-4"></div>

  </div>

  <script>
    let currentTheme = 'dark';

    // SVG Templates Raw Content
    const darkSvgUrl = '../favor_cards/weave_favor_card.svg';
    const lightSvgUrl = '../favor_cards/weave_favor_card_light.svg';

    let darkSvgContent = '';
    let lightSvgContent = '';

    async function loadSvgTemplates() {
      try {
        const [darkRes, lightRes] = await Promise.all([
          fetch(darkSvgUrl),
          fetch(lightSvgUrl)
        ]);

        darkSvgContent = await darkRes.text();
        lightSvgContent = await lightRes.text();

        renderSheet();
      } catch (err) {
        console.error('Error loading SVG templates:', err);
      }
    }

    function renderSheet() {
      const svgToRender = currentTheme === 'dark' ? darkSvgContent : lightSvgContent;
      
      document.getElementById('card-1').innerHTML = svgToRender;
      document.getElementById('card-2').innerHTML = svgToRender;
      document.getElementById('card-3').innerHTML = svgToRender;
      document.getElementById('card-4').innerHTML = svgToRender;

      if (currentTheme === 'light') {
        document.getElementById('body-container').classList.add('light-theme');
      } else {
        document.getElementById('body-container').classList.remove('light-theme');
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      renderSheet();
    }

    // Initialize on load
    loadSvgTemplates();
  </script>
</body>
</html>

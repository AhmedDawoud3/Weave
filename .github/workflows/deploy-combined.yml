name: Build and Deploy Frontend-Backend to Azure Web App for Containers

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-combined.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Deploy Combined App
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log in to Azure using OIDC (Same credentials as the Python engine deployment)
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0CE1FFF3F97F4036B411E2D9FA15C49E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E44147736554042BBCE9C0411350732 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C271FE427DBB4778B9F3FC74F4FDDD77 }}

      # Set up Docker Buildx for optimization and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Azure Container Registry (ACR) using the token obtained from Azure Login
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # Build and push the combined container image to ACR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/weave-combined:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/weave-combined:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy the image to the Azure Web App for Containers
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'weave-combined-app' # Replace with your Azure Web App name or use ${{ secrets.AZURE_WEBAPP_NAME }}
          images: '${{ secrets.ACR_NAME }}.azurecr.io/weave-combined:${{ github.sha }}'

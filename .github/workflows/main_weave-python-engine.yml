# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - weave-python-engine

on:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
  workflow_dispatch:

jobs:
  build:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: https://engine.weave-ai.dev # Link appears in GitHub UI
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 🛠️ Local Build Section (Optional)
      # We use `uv` to instantly generate a standard requirements.txt from pyproject.toml. 
      # This allows Azure's build engine (Oryx) to install dependencies natively on the server.
      - name: Generate requirements.txt using uv
        working-directory: ./engine
        run: |
          uv export --no-hashes --format requirements.txt > requirements.txt

      # 📖 Build MkDocs documentation so /docs endpoint works on the deployed app
      - name: Sync project and docs dependencies
        working-directory: ./engine
        run: uv sync --group docs

      - name: Build MkDocs site
        working-directory: ./engine
        run: uv run mkdocs build

      - name: Create .env file for deployment
        working-directory: ./engine
        run: |
          echo "WEAVE_ENGINE_API_KEY=${{ secrets.WEAVE_ENGINE_API_KEY }}" > .env
          echo "WEAVE_ENGINE_DISABLE_AUTH=false" >> .env

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ./engine
            !./engine/antenv/
            !./engine/.venv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'weave-python-engine'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_21D5E8F12BED4A78A25AEA94128FB6E7 }}
          
# Deploy Weave Frontend to Azure App Service
# Azure App Service runs Node.js with Express to serve the React SPA

name: Build and deploy Node.js app to Azure Web App - Weave-Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set production API URL
        working-directory: frontend
        run: echo "VITE_API_URL=https://weave-ai.dev" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the SPA
        working-directory: frontend
        run: npm run build

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC85BF21FBC44F7E9124E5579313D5DB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2E3A69A375064DA0865F8971AD890B79 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_454C1786A1924197B41EF76FD3FE5240 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Weave-Frontend'
          slot-name: 'Production'
          package: .

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "engine/docs/**"
      - "engine/mkdocs.yml"
      - "engine/schemas.py"
      - "engine/compiler/**"
      - "engine/dataset/**"
      - "engine/main.py"
      - "engine/docs-requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"
      - run: uv sync
      - run: uv pip install -r docs-requirements.txt
      - run: uv run mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: engine/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

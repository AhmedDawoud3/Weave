version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Override the DB connection string for the container network
      - ConnectionStrings__DefaultConnection=Server=db;Database=WeaveDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      # Point to the external python engine
      - Engine__BaseUrl=https://engine.weave-ai.dev
      - Engine__ApiKey=${WEAVE_ENGINE_API_KEY}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  sqldata:

site_name: Weave Engine Docs
site_description: Documentation for the Weave Neural Network Engine
site_url: https://weave-project.github.io/engine
repo_url: https://github.com/Weave-Project/Weave
repo_name: Weave

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_object_full_path: false
            show_category_heading: true
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Endpoints:
      - api/index.md
      - Validate Pipeline: api/validate-pipeline.md
      - Infer Layer Shape: api/infer-layer.md
      - Infer Dataset Shape: api/infer-dataset.md
  - Schemas:
      - schemas/index.md
      - Layer Params: schemas/layer-params.md
      - Node Types: schemas/nodes.md
      - Graph & Edges: schemas/graph-and-edges.md
      - Dataset Configs: schemas/dataset-configs.md
      - Training Configs: schemas/training-configs.md
      - Request & Response: schemas/request-response.md
  - Compiler Module:
      - compiler/index.md
      - Graph Compiler: compiler/graph-compiler.md
      - Weave Block: compiler/weave-block.md
      - Component Factory: compiler/component-factory.md
      - Custom Modules: compiler/custom-modules.md
  - Dataset Module:
      - dataset/index.md
      - Shape Inference: dataset/shape-inference.md
      - Dataset Factory: dataset/dataset-factory.md
      - Registry: dataset/registry.md
      - Scanner: dataset/scanner.md
      - Transform Factory: dataset/transform-factory.md
      - DataLoader: dataset/dataloader.md
  - API Reference:
      - reference/compiler.md
      - reference/dataset.md
      - reference/schemas.md

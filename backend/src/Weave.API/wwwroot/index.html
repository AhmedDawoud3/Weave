<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weave — Intelligent Visual IDE for Deep Learning</title>
    <meta name="description" content="A modular drag-and-drop neural network editor built for rapid prototyping and experimentation.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p { color: #888; font-size: 1.1rem; }
        .status {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Weave</h1>
        <p>Intelligent Visual IDE for Deep Learning</p>
        <div class="status">
            Backend API is running. Replace this with the React SPA build output.
        </div>
    </div>
</body>
</html>

services:
  - type: web
    name: weave-runner
    env: python
    plan: free
    rootDir: backend
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv sync
    startCommand: |
      export PATH="$HOME/.local/bin:$PATH"
      uv run python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALLOWED_ORIGINS
        value: https://your-netlify-site.netlify.app

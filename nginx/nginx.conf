user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression for Frontend Assets Performance
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTTP Server: Redirect all traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name weave-ai.dev www.weave-ai.dev;

        # Let's Encrypt ACME Challenge verification path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Secure Application Entrypoint
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name weave-ai.dev www.weave-ai.dev;

        # SSL Certificates (Mounted from Let's Encrypt on host)
        ssl_certificate /etc/letsencrypt/live/weave-ai.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weave-ai.dev/privkey.pem;

        # Strong Security SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Default Reverse Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API routing: /api/ -> .NET Backend
        location /api/ {
            proxy_pass http://backend:5000;
            
            # Timeouts for API connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static / SPA Routing: / -> React/Next.js/Vite Frontend
        location / {
            proxy_pass http://frontend:3000;
        }
    }
}
